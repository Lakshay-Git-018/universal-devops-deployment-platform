
name: LearnHub Docker CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-build:
    name: Build and Validate Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t learnhub:ci .

      - name: Verify Docker image
        run: docker image inspect learnhub:ci

      - name: Report success
        run: echo "LearnHub Docker image built successfully!"
